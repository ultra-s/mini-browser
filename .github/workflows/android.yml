name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "core/**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore (CI-local, stable via cache)
        id: keystore
        uses: actions/cache@v4
        with:
          path: mini.keystore
          key: mini-keystore-v1

      - name: Create keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore mini.keystore -alias mini \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass minimini -keypass minimini \
            -dname "CN=Mini Browser, OU=Mini, O=Mini, L=Net, S=Net, C=US"

      - name: Build signed release APK
        working-directory: android
        env:
          MINI_STORE_FILE: ${{ github.workspace }}/mini.keystore
          MINI_STORE_PASS: minimini
          MINI_KEY_ALIAS: mini
          MINI_KEY_PASS: minimini
        run: gradle assembleRelease --no-daemon

      - name: Collect signed APK
        run: |
          mkdir -p out
          find android/app/build/outputs -name "*.apk" ! -name "*unsigned*" -exec cp {} out/Mini.apk \;
          ls -la out/
          test -f out/Mini.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-browser-android
          path: out/Mini.apk
          if-no-files-found: error

  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mini-browser-android
          path: out

      - name: Read version
        id: ver
        run: echo "name=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Attach APK to versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: "Mini Browser v${{ steps.ver.outputs.name }}"
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: out/Mini.apk

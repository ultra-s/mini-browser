name: desktop

on:
  push:
    branches: [main]
    paths: ["src/**", "core/**", "mini-agent/**", "Cargo.toml", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (mini-core)
        run: cargo test -p mini-core

  build-desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libgtk-3-dev libx11-dev libasound2-dev

      - name: Export CEF binaries
        shell: bash
        run: |
          cargo install --locked --git https://github.com/tauri-apps/cef-rs export-cef-dir || cargo install --git https://github.com/tauri-apps/cef-rs export-cef-dir
          export-cef-dir --force $HOME/.local/share/cef

      - name: Build (no sandbox for portable artifact)
        shell: bash
        run: |
          export CEF_PATH="$HOME/.local/share/cef"
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$CEF_PATH"
          fi
          cargo build --release --no-default-features
          (cd mini-agent && cargo build --release)
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mini-browser.exe dist/
            cp mini-agent/target/release/mini-agent.exe dist/
          else
            cp target/release/mini-browser dist/
            cp mini-agent/target/release/mini-agent dist/
          fi

      - name: Bundle CEF runtime (self-contained — no separate download)
        shell: bash
        run: |
          CEF_DIR="$HOME/.local/share/cef"
          # copy runtime files the binary needs (skip dev headers/cmake)
          for f in "$CEF_DIR"/*; do
            base=$(basename "$f")
            case "$base" in
              cmake|CMakeLists.txt|libcef_dll|archive.json) continue ;;
            esac
            cp -r "$f" dist/
          done
          # strip the fat debug symbols off libcef
          if [ "$RUNNER_OS" = "Linux" ]; then
            strip dist/libcef.so dist/v8_context_snapshot.bin 2>/dev/null || true
            strip dist/mini-browser dist/mini-agent 2>/dev/null || true
          else
            # windows: strip not available; libcef.dll keeps symbols but still works
            true
          fi
          # launcher so LD_LIBRARY_PATH just works
          if [ "$RUNNER_OS" = "Linux" ]; then
            printf '%s\n' '#!/bin/bash' 'DIR="$(cd "$(dirname "$0")" && pwd)"' 'export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"' 'exec "$DIR/mini-browser" "$@"' > dist/mini-browser-run
            chmod +x dist/mini-browser-run
          fi
          du -sh dist

      - name: Upload binaries (raw, not zipped)
        uses: actions/upload-artifact@v4
        with:
          name: mini-browser-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error


name: desktop

on:
  push:
    branches: [main]
    paths: ["src/**", "core/**", "mini-agent/**", "Cargo.toml", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (mini-core)
        run: cargo test -p mini-core

  build-desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libgtk-3-dev libx11-dev libasound2-dev

      - name: Export CEF binaries
        shell: bash
        run: |
          cargo install --locked --git https://github.com/tauri-apps/cef-rs export-cef-dir || cargo install --git https://github.com/tauri-apps/cef-rs export-cef-dir
          export-cef-dir --force $HOME/.local/share/cef

      - name: Build (no sandbox for portable artifact)
        shell: bash
        run: |
          export CEF_PATH="$HOME/.local/share/cef"
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$CEF_PATH"
          fi
          cargo build --release --no-default-features
          (cd mini-agent && cargo build --release)
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mini-browser.exe dist/
            cp mini-agent/target/release/mini-agent.exe dist/
          else
            cp target/release/mini-browser dist/
            cp mini-agent/target/release/mini-agent dist/
          fi

      - name: Upload binaries (raw, not zipped)
        uses: actions/upload-artifact@v4
        with:
          name: mini-browser-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect linux binaries
        uses: actions/download-artifact@v4
        with:
          name: mini-browser-x86_64-unknown-linux-gnu
          path: out/linux

      - name: Collect windows binaries
        uses: actions/download-artifact@v4
        with:
          name: mini-browser-x86_64-pc-windows-msvc
          path: out/windows

      - name: Read version
        id: ver
        run: echo "name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Attach raw binaries to versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: "Mini Browser v${{ steps.ver.outputs.name }}"
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: |
            out/linux/mini-browser
            out/linux/mini-agent
            out/windows/mini-browser.exe
            out/windows/mini-agent.exe
